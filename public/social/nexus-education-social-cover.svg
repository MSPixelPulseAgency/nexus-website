<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Nexus Education Private School social cover</title>
  <desc id="description">Nexus Education logo with a concise overview of student-centred Ontario learning and academic pathways.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062047" />
      <stop offset="0.62" stop-color="#0b3775" />
      <stop offset="1" stop-color="#125ca9" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.99" />
      <stop offset="1" stop-color="#edf5ff" stop-opacity="0.96" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f2b632" stop-opacity="0.46" />
      <stop offset="1" stop-color="#f2b632" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#020e22" flood-opacity="0.32" />
    </filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#ffffff" stroke-opacity="0.055" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="1100" cy="48" r="360" fill="url(#glow)" />
  <circle cx="70" cy="650" r="300" fill="url(#glow)" opacity="0.56" />
  <path d="M-50 146C220 4 421 24 584 120" fill="none" stroke="#f2b632" stroke-opacity="0.44" stroke-width="7" />
  <path d="M806 548c150-105 296-119 454-33" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="5" />

  <g filter="url(#shadow)">
    <rect x="88" y="62" width="1024" height="506" rx="42" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.74" stroke-width="2" />
  </g>
  <rect x="114" y="88" width="10" height="454" rx="5" fill="#e5ad22" />

  <image href="/brand/nexus-logo-official-transparent.png" x="164" y="119" width="470" height="287" preserveAspectRatio="xMidYMid meet" />

  <g font-family="Arial, Helvetica, sans-serif" fill="#082a58">
    <text x="685" y="178" font-size="19" font-weight="700" letter-spacing="4.2" fill="#bd8510">ONTARIO LEARNING</text>
    <text x="685" y="229" font-size="34" font-weight="750">Student-centred learning.</text>
    <text x="685" y="274" font-size="34" font-weight="750">Clear academic pathways.</text>
    <line x1="685" y1="309" x2="1036" y2="309" stroke="#d8e4f2" stroke-width="2" />
    <text x="685" y="354" font-size="21" font-weight="600">Elementary learning</text>
    <text x="685" y="389" font-size="21" font-weight="600">Ontario secondary courses</text>
    <text x="685" y="424" font-size="21" font-weight="600">Academic planning &amp; student support</text>
  </g>

  <rect x="164" y="465" width="872" height="1" fill="#d9e4f1" />
  <text x="164" y="511" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#0a3268">NEXUSEPS.COM</text>
  <circle cx="1018" cy="501" r="17" fill="#e5ad22" />
  <path d="m1010 501 6 6 11-14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
